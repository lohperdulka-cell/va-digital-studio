<header class="header">
  <div class="header__inner">
    <a class="logo" href="/">
      <span class="logo__mark" aria-hidden="true">VA</span>
      <span class="logo__text">Digital Studio</span>
    </a>

    <nav class="header__nav" aria-label="Основная навигация">
      <a class="header__link {% if path == '/' %}is-active{% endif %}" href="/">Главная</a>
      <a class="header__link {% if path.startswith('/catalog') %}is-active{% endif %}" href="/catalog">Каталог</a>
      <a class="header__link {% if path.startswith('/portfolio') %}is-active{% endif %}" href="/portfolio">Портфолио</a>
      <a class="header__link {% if path.startswith('/news') %}is-active{% endif %}" href="/news">Новости</a>
      <a class="header__link {% if path == '/calculator' %}is-active{% endif %}" href="/calculator">Калькулятор</a>
      <a class="header__link {% if path.startswith('/faq') %}is-active{% endif %}" href="/faq">FAQ</a>
      <a class="header__link {% if path == '/about' %}is-active{% endif %}" href="/about">О студии</a>
      {% if is_admin %}
        <a class="header__link {% if path.startswith('/dashboard') %}is-active{% endif %}" href="/dashboard">Дашборд</a>
      {% endif %}
    </nav>

    <div class="header__actions">
      {% if current_user %}
        <div class="user-menu" data-user-menu>
          <button type="button" class="user-menu__trigger" data-user-menu-trigger
                  aria-haspopup="true" aria-expanded="false">
            <span class="avatar">
              {% if current_user.avatar_url %}
                <img src="{{ current_user.avatar_url }}" alt="" width="32" height="32" referrerpolicy="no-referrer">
              {% else %}
                {{ current_user.initials }}
              {% endif %}
            </span>
            <span class="user-menu__name">{{ current_user.display_name }}</span>
          </button>

          <div class="user-menu__dropdown" data-user-menu-dropdown hidden>
            <div class="user-menu__head">
              <div><strong>{{ current_user.display_name }}</strong></div>
              <div class="user-menu__email">{{ current_user.email }}</div>
            </div>
            <a class="user-menu__item" href="/profile">👤 Профиль</a>
            {% if is_admin %}
              <a class="user-menu__item" href="/dashboard">🛠 Дашборд</a>
            {% endif %}
            <a class="user-menu__item" href="/profile/orders">📦 Мои заказы</a>
            <form method="post" action="/auth/logout">
              <input type="hidden" name="{{ csrf_field_name }}" value="{{ csrf_token }}">
              <button type="submit" class="user-menu__item">🚪 Выйти</button>
            </form>
          </div>
        </div>
      {% else %}
        <a class="btn btn--primary btn--sm" href="/auth/login?next={{ next_url | urlencode }}">
          Войти
        </a>
      {% endif %}

      <button type="button" class="burger" data-burger aria-label="Открыть меню"
              aria-expanded="false" aria-controls="mobile-drawer">
        <span class="burger__box" aria-hidden="true">
          <span class="burger__line"></span>
          <span class="burger__line"></span>
          <span class="burger__line"></span>
        </span>
      </button>
    </div>
  </div>
</header>
