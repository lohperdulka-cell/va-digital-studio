{# Support ticket modal — opened from the footer or the burger menu. #}
<div class="modal" id="support-modal" data-support-modal hidden role="dialog"
     aria-modal="true" aria-labelledby="support-modal-title">
  <div class="modal__panel">
    <div class="modal__head">
      <div>
        <h2 class="modal__title" id="support-modal-title">Служба поддержки</h2>
        <p class="small muted" style="margin:0">Отвечаем в течение одного рабочего дня</p>
      </div>
      <button type="button" class="modal__close" data-support-close aria-label="Закрыть">&times;</button>
    </div>

    <form class="form" method="post" action="/support">
      <input type="hidden" name="{{ csrf_field_name }}" value="{{ csrf_token }}">

      {% if not current_user %}
        <div class="field">
          <label class="field__label" for="support-email">Ваш e-mail</label>
          <input class="input" type="email" id="support-email" name="email"
                 placeholder="you@example.com" required maxlength="320" autocomplete="email">
        </div>
        <div class="field">
          <label class="field__label" for="support-name">Имя</label>
          <input class="input" type="text" id="support-name" name="name"
                 placeholder="Как к вам обращаться" maxlength="200" autocomplete="name">
        </div>
      {% endif %}

      <div class="field">
        <label class="field__label" for="support-subject">Тема</label>
        <input class="input" type="text" id="support-subject" name="subject"
               placeholder="Кратко о вопросе" required minlength="3" maxlength="200">
      </div>

      <div class="field">
        <label class="field__label" for="support-message">Сообщение</label>
        <textarea class="textarea" id="support-message" name="message" required
                  minlength="10" maxlength="5000"
                  placeholder="Опишите вопрос подробнее — так мы поможем быстрее"></textarea>
        <span class="field__hint">Не более 5000 символов</span>
      </div>

      <button type="submit" class="btn btn--primary btn--block">Отправить обращение</button>
      <p class="tiny dim" style="margin:0">
        Отправляя форму, вы соглашаетесь с обработкой персональных данных.
      </p>
    </form>
  </div>
</div>
