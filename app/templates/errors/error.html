{% extends "base.html" %}
{% block title %}{{ status_code }} — {{ title }} · {{ app_name }}{% endblock %}

{% block content %}
<div class="container">
  <div class="empty" style="margin-top:48px">
    <div class="empty__icon" aria-hidden="true">
      {% if status_code == 404 %}🧭{% elif status_code == 403 %}🔒{% else %}⚠️{% endif %}
    </div>
    <h1 class="empty__title" style="font-size:2.4rem">{{ status_code }}</h1>
    <h2 class="empty__title">{{ title }}</h2>
    <p class="empty__text">{{ detail }}</p>
    <div class="row" style="justify-content:center">
      <a class="btn btn--primary" href="/">На главную</a>
      <a class="btn btn--ghost" href="/catalog">Каталог услуг</a>
    </div>
  </div>
</div>
{% endblock %}
