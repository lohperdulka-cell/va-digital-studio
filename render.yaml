# Render blueprint (infrastructure as code).
#
# Deploy with: Render Dashboard -> New -> Blueprint -> pick this repository.
# Secrets marked `sync: false` are prompted for in the dashboard and never
# stored in git.  `generateValue: true` makes Render mint a random value.

databases:
  - name: va-studio-db
    databaseName: va_studio
    user: va_studio
    # Free Postgres needs no payment method, but it expires 30 days after
    # creation.  Before that happens, either upgrade this to `basic-256mb` or
    # recreate the database and let the app re-bootstrap its content.
    plan: free
    region: frankfurt

services:
  - type: web
    name: va-digital-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The image's CMD already runs migrations then the server; stating it here
    # keeps the dashboard readable.
    dockerCommand: /app/start.sh
    # `free` is what makes the deploy card-free.  A paid plan (starter, etc.)
    # is what triggers Render's "add a payment method" step.  Free web
    # services spin down after 15 minutes idle and take ~1 minute to wake.
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    # One instance on purpose: the WebSocket chat hub and the rate limiter keep
    # state in process memory (see README "Scaling").  Scaling out requires
    # Redis-backed state first.
    numInstances: 1
    envVars:
      # --- Runtime ---------------------------------------------------------
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      # Render terminates TLS and proxies to the container over HTTP.
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      # BASE_URL is derived from RENDER_EXTERNAL_URL automatically; set it
      # explicitly only for a custom domain.

      # --- Database --------------------------------------------------------
      # Injected from the database above.  Render emits a bare `postgresql://`
      # URL, which app/config.py rewrites to `postgresql+psycopg2://`.
      - key: DATABASE_URL
        fromDatabase:
          name: va-studio-db
          property: connectionString

      # --- Secrets ---------------------------------------------------------
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false

      # --- E-mail -----------------------------------------------------------
      # IMPORTANT: Render's FREE web services cannot open outbound SMTP
      # connections at all — ports 25, 465 and 587 are blocked.  Gmail SMTP
      # therefore cannot work on the free plan; use an HTTP mail API instead
      # (it goes over 443).  Set EMAIL_API_PROVIDER and EMAIL_API_KEY below.
      - key: SUPPORT_EMAIL
        value: ethernallhatred@gmail.com
      # "brevo" (300/day free, verify one sender address) or "resend".
      - key: EMAIL_API_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      # --- SMTP (paid plans / self-hosting only) ----------------------------
      # Ignored when EMAIL_API_PROVIDER is set.  Keep EMPTY on the free plan:
      # the ports are blocked, so a configured SMTP host would fail at send
      # time instead of showing the honest "not configured" notice.
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        sync: false
